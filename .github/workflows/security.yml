name: Security Scan

on:
  push:
    branches:
      - main
      - master

  pull_request:

  schedule:
    # Every Monday at 00:00 UTC
    - cron: "0 0 * * 1"

  workflow_dispatch:

jobs:
  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high