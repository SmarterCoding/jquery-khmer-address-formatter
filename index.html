<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khmer Address Auto-Formatter</title>

  <!-- Google Font: Kantumruy Pro -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- jQuery Library -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <style>
    body {
      font-family: 'Kantumruy Pro', 'Khmer OS Battambang', 'Segoe UI', Tahoma, sans-serif;
      padding: 40px 20px;
      background-color: #f4f6f9;
      color: #333;
    }

    .form-container {
      max-width: 600px;
      margin: 0 auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }

    h2 {
      margin-top: 0;
      color: #111;
      font-size: 22px;
      border-bottom: 2px solid #eef2f7;
      padding-bottom: 12px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 15px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      font-size: 16px;
      font-family: inherit;
      border: 1.5px solid #dcdfe6;
      border-radius: 8px;
      box-sizing: border-box;
      transition: all 0.2s ease-in-out;
    }

    input[type="text"]:focus {
      border-color: #007bff;
      box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.15);
      outline: none;
    }

    .hint {
      font-size: 13px;
      color: #6c757d;
      margin-top: 6px;
      line-height: 1.4;
    }

    .preview-box {
      margin-top: 20px;
      padding: 15px;
      background-color: #f8f9fa;
      border-left: 4px solid #007bff;
      border-radius: 6px;
    }

    .preview-box label {
      font-size: 13px;
      color: #6c757d;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .preview-text {
      font-size: 17px;
      font-weight: 600;
      color: #007bff;
      word-break: break-word;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>កូដដកឃ្លាអាសយដ្ឋានស្វ័យប្រវត្តិ (Khmer Address Auto-Formatter)</h2>
    <div class="form-group">
      <label for="addressField">បញ្ចូលអាសយដ្ឋាន (Enter Address):</label>
      <input
        type="text"
        id="addressField"
        placeholder="ឧទាហរណ៍៖ ភូមិ6សង្កាត់4អូរត្រេះព្រះសីហនុ"
        autocomplete="off"
        class="input-address"
      >
      <div class="hint">
        💡 វាយបញ្ចូលអត្ថបទរួច <strong>ចុចចេញក្រៅប្រអប់ (Blur)</strong> ឬ <strong>ចុច Enter</strong> ដើម្បីឱ្យប្រព័ន្ធដកឃ្លាស្វ័យប្រវត្តិ។
      </div>
    </div>

    <div class="preview-box">
      <label>លទ្ធផលបន្ទាប់ពី Format (Output Result):</label>
      <div id="outputPreview" class="preview-text">-</div>
    </div>
  </div>
<script type="text/javascript" src="/dist/jquery.khmer-address-formatter.min.js"></script>
  <script>
    $(document).ready(function() {
        $('#addressField').khmerAddressFormatter({
            spacing: 1,
            convertNumbers: true
        });

        // ដំណើរកែប្រែនៅពេលចាកចេញពី Input (Blur Event)
        $('.input-address').on('change', function() {
            let formattedText = $.formatKhmerAddress($(this).val());
            $(this).val(formattedText);
            $('#outputPreview').text(formattedText || '-');
        });
    });
  </script>

</body>
</html>
